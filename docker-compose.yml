services:
  web:
    build: .
    image: stoicfinch:prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stoicfinch.rule=Host(`stoicfinch.paragu-ai.com`)"
      - "traefik.http.routers.stoicfinch.entrypoints=websecure"
      - "traefik.http.services.stoicfinch.loadbalancer.server.port=3000"
